<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Pocket Ark — a 2.5D habitat pool roguelike</title>
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #0a0d16;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color: #d9d2b8;
  }
  /* the harbour glow behind the cabinet */
  body::before {
    content: ''; position: fixed; inset: 0; pointer-events: none;
    background:
      radial-gradient(120% 90% at 50% 12%, rgba(46,86,138,.42), transparent 62%),
      radial-gradient(90% 70% at 50% 100%, rgba(255,203,82,.10), transparent 60%);
  }
  #wrap {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }
  #game {
    display: block;
    image-rendering: pixelated;
    image-rendering: -moz-crisp-edges;
    image-rendering: crisp-edges;
    background: #0a0d16;
    border-radius: 2px;
    box-shadow:
      0 0 0 3px #43291b,
      0 0 0 5px #8a5a34,
      0 0 0 6px #2a1a12,
      0 26px 60px -12px rgba(0,0,0,.85),
      0 0 120px -20px rgba(63,208,201,.20);
    cursor: crosshair;
    touch-action: none;
  }
  /* faint scanlines over the whole cabinet — sits above the canvas, ignores input */
  #scan {
    position: fixed; inset: 0; pointer-events: none; opacity: .16;
    background: repeating-linear-gradient(to bottom, rgba(0,0,0,.55) 0 1px, transparent 1px 3px);
    mix-blend-mode: multiply;
  }
  #boot, #gate {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px;
    background: #0a0d16; z-index: 20; text-align: center; padding: 24px;
  }
  #gate { background: rgba(10,13,22,.92); cursor: pointer; }
  .title { font-size: 30px; letter-spacing: 5px; color: #ffcb52; text-shadow: 0 2px 0 #43291b; }
  .sub { font-size: 12px; color: #6f7688; letter-spacing: 2px; }
  .hint { font-size: 11px; color: #3fd0c9; letter-spacing: 1px; }
  .keys { font-size: 10px; color: #4d5468; line-height: 1.9; letter-spacing: .5px; }
  .err { color:#e04a58; font-size:12px; max-width: 620px; white-space: pre-wrap; text-align:left; }
  body.ready #wrap { animation: rise .5s ease-out both; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: none } }
  .pulse { animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity:.55 } 50% { opacity:1 } }
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="640" height="360"></canvas></div>
<div id="scan"></div>

<div id="boot">
  <div class="title">POCKET ARK</div>
  <div class="sub">loading the manifest…</div>
</div>

<div id="gate" hidden>
  <div class="title">POCKET ARK</div>
  <div class="sub">A 2.5D HABITAT POOL ROGUELIKE</div>
  <div class="hint pulse">CLICK TO BOARD</div>
  <div class="keys">
    click an animal to take it as your cue &nbsp;·&nbsp; hold to charge &nbsp;·&nbsp; release to break<br>
    A / D or mouse wheel = english &nbsp;·&nbsp; R = re-rack &nbsp;·&nbsp; 1 / 2 = feed &nbsp;·&nbsp; M = mute &nbsp;·&nbsp; F = fullscreen
  </div>
</div>

<script type="module">
  // The click gate exists purely so WebAudio has a gesture to unlock on.
  const gate = document.getElementById('gate');
  const boot = document.getElementById('boot');
  let started = false;

  function fail(e) {
    boot.innerHTML = '<div class="title">RUN AGROUND</div>'
      + '<div class="sub">the game failed to load</div>'
      + '<div class="err">' + String((e && (e.stack || e.message)) || e).replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c])) + '</div>'
      + '<div class="keys">If you opened this file directly, ES modules are blocked by the browser.<br>'
      + 'Serve it instead: <b>node serve.mjs</b> or <b>python3 -m http.server 8000</b></div>';
    boot.hidden = false;
  }

  window.addEventListener('error', (e) => { if (!started) fail(e.error || e.message); });
  window.addEventListener('unhandledrejection', (e) => { if (!started) fail(e.reason); });

  boot.querySelector('.sub').textContent = 'loading the manifest…';
  gate.hidden = false;
  boot.hidden = true;

  gate.addEventListener('click', async () => {
    if (started) return;
    started = true;
    gate.remove();
    boot.hidden = false;
    try {
      await import('./src/main.js');
    } catch (e) {
      started = false;
      fail(e);
    }
  }, { once: true });
</script>
</body>
</html>
