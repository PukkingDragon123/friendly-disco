<title>Pocket Ark</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap">
<style>
  /* THE CABINET.
     A single-theme page on purpose: this is a lamplit wooden machine at dusk, and it should
     look the same on anybody's screen. Every colour is painted explicitly -- including the
     body's ground -- so it never borrows the host page's. The palette is lifted straight out
     of src/core/palette.js, which is why the frame and the game read as one object. */
  :root {
    color-scheme: dark;
    --hull:   #0d0b0a;   /* the room the cabinet stands in */
    --pitch:  #1a1210;   /* ink: the game's own black */
    --wood0:  #2a1a13;
    --wood2:  #6d462c;
    --wood3:  #96663b;
    --brass:  #f1d99c;   /* brass3: the type */
    --lamp:   #f5c451;   /* gold: the one accent, spent on the boarding line */
    --foam:   #d3ebe2;   /* the water's highlight */
    --grey:   #7d7164;
    --red:    #d6614a;
    /* a pixel face for the things that are a NAME, a mono for the things that are a
       sentence: the wordmark should look like the game, the instructions should be read */
    --pixel: 'Silkscreen', ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  html, body {
    margin: 0; padding: 0; overflow: hidden;
    height: 100%; height: 100dvh;
    background: var(--hull);
    font-family: var(--mono);
    color: var(--brass);
    -webkit-text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
    touch-action: none;
    user-select: none; -webkit-user-select: none;
  }
  /* the harbour behind it: a cold sky above, a warm lamp below */
  body::before {
    content: ''; position: fixed; inset: 0; pointer-events: none;
    background:
      radial-gradient(120% 90% at 50% 10%, rgba(47,96,104,.40), transparent 62%),
      radial-gradient(90% 70% at 50% 100%, rgba(245,196,81,.10), transparent 60%);
  }
  #wrap {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    box-sizing: border-box;
  }
  #game {
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    background: var(--pitch);
    /* the frame: three rings of timber, then the room's shadow, then the water's glow */
    box-shadow:
      0 0 0 3px var(--wood0),
      0 0 0 6px var(--wood3),
      0 0 0 8px var(--wood0),
      0 26px 60px -12px rgba(0,0,0,.85),
      0 0 120px -24px rgba(63,208,201,.18);
    cursor: crosshair;
    touch-action: none;
  }
  /* scanlines over the whole cabinet -- above the canvas, deaf to input */
  #scan {
    position: fixed; inset: 0; pointer-events: none; opacity: .14;
    background: repeating-linear-gradient(to bottom, rgba(0,0,0,.55) 0 1px, transparent 1px 3px);
    mix-blend-mode: multiply;
  }
  /* On a phone every pixel of screen matters, so the frame and the scanlines go away. */
  @media (max-width: 900px), (pointer: coarse) {
    #game { box-shadow: none; cursor: default; }
    #scan { display: none; }
  }
  /* Landscape is not optional: the game is 16:9 and a portrait phone renders it a centimetre tall. */
  #rotate {
    position: fixed; inset: 0; z-index: 40; display: none;
    flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    background: var(--hull); text-align: center; padding: 24px;
  }
  body.portrait #rotate { display: flex; }
  #rotate .phone {
    width: 54px; height: 92px; border: 4px solid var(--wood3); border-radius: 8px;
    animation: tip 1.9s ease-in-out infinite;
  }
  @keyframes tip { 0%, 45% { transform: rotate(0) } 70%, 100% { transform: rotate(-90deg) } }
  #fsbtn {
    position: fixed; z-index: 30;
    right: calc(8px + env(safe-area-inset-right)); top: calc(8px + env(safe-area-inset-top));
    width: 34px; height: 34px; display: none; align-items: center; justify-content: center;
    background: rgba(13,11,10,.7); border: 2px solid var(--wood3); border-radius: 3px;
    color: var(--lamp); font-size: 15px; line-height: 1; cursor: pointer;
    font-family: inherit;
  }
  @media (pointer: coarse) { #fsbtn { display: flex; } }
  body.fs #fsbtn { opacity: .35; }

  /* THE GATE. The first thing anybody reads, and the gesture WebAudio unlocks on. */
  #boot, #gate {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 16px;
    background: var(--hull); z-index: 20; text-align: center; padding: 26px;
    box-sizing: border-box;
  }
  #boot[hidden], #gate[hidden] { display: none; }   /* `display:flex` above beats the UA's [hidden] rule */
  #gate { background: var(--hull); cursor: pointer; border: 0; width: 100%; font: inherit; color: inherit; }
  #gate:focus-visible { outline: 3px solid var(--lamp); outline-offset: -6px; }
  .title {
    font-family: var(--pixel);
    font-size: clamp(26px, 5.4vw, 42px); font-weight: 700; letter-spacing: .1em;
    color: var(--brass); text-shadow: 0 3px 0 var(--wood0), 0 5px 0 rgba(0,0,0,.5);
    text-wrap: balance; margin: 0;
  }
  .sub { font-family: var(--pixel); font-size: 11px; color: var(--grey); letter-spacing: .2em; }
  .hint { font-family: var(--pixel); font-size: 13px; color: var(--lamp); letter-spacing: .16em; }
  .rule { width: min(420px, 76vw); height: 2px; background: var(--wood0); }
  /* the four verbs of the game, as a table rather than a paragraph: a player scans this */
  .keys {
    display: grid; grid-template-columns: auto 1fr; gap: 7px 16px;
    font-size: 11px; line-height: 1.5; color: var(--grey);
    max-width: min(560px, 88vw); text-align: left; letter-spacing: .04em;
  }
  .keys b {
    font-family: var(--pixel); color: var(--foam); font-weight: 400;
    white-space: nowrap; letter-spacing: .08em;
  }
  .keys span { line-height: 1.65; }
  .err { color: var(--red); font-size: 11px; max-width: 620px; white-space: pre-wrap; text-align: left; }
  body.ready #wrap { animation: rise .5s ease-out both; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: none } }
  .pulse { animation: pulse 1.5s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity:.5 } 50% { opacity:1 } }
  @media (prefers-reduced-motion: reduce) {
    .pulse, #rotate .phone, body.ready #wrap { animation: none; }
  }
</style>

<div id="wrap"><canvas id="game" width="960" height="540" aria-label="Pocket Ark game screen"></canvas></div>
<div id="scan"></div>
<button id="fsbtn" title="Fullscreen" aria-label="Fullscreen">⛶</button>

<div id="rotate">
  <div class="phone"></div>
  <div class="title" style="font-size:19px">TURN YOUR DEVICE</div>
  <div class="sub">THE OCEAN NEEDS LANDSCAPE</div>
</div>

<div id="boot">
  <h1 class="title">POCKET ARK</h1>
  <div class="sub">STOKING THE BOILER…</div>
</div>

<button id="gate" type="button">
  <h1 class="title">POCKET ARK</h1>
  <div class="sub">A COZY PIXEL-ART RESCUE ROGUELIKE</div>
  <div class="rule"></div>
  <div class="keys">
    <b>THE ARENA</b><span>Drag back from one of your animals and let go — it is pool, and the table is the fight. Hit a beast twice to daze it, then nudge it out through a door in the ark.</span>
    <b>THE APPLE</b><span>Tap APPLES, then a dazed beast: it comes aboard tame, whatever the doors say.</span>
    <b>THE MAP</b><span>Only ever up, and only along a line you are already on. The number on a stop is what it will cost you.</span>
    <b>THE FLOOD</b><span>It never stops rising. Every crossing spends some of the ocean you have left.</span>
    <b>KEYS</b><span>1…7 pick an animal · A the apple · ESC cancel · M mute · F fullscreen</span>
  </div>
  <div class="hint pulse">CLICK TO BOARD</div>
</button>

<script>
(function () {
  // The click gate exists so WebAudio has a gesture to unlock on, and so a phone has one to
  // go fullscreen with. Everything the game needs is already in this document.
  var gate = document.getElementById('gate');
  var boot = document.getElementById('boot');
  var started = false;

  function esc(s) { return String(s).replace(/[<>&]/g, function (c) {
    return { '<': '&lt;', '>': '&gt;', '&': '&amp;' }[c];
  }); }

  function fail(e) {
    boot.innerHTML = '<h1 class="title">RUN AGROUND</h1>'
      + '<div class="sub">THE GAME FAILED TO START</div>'
      + '<div class="err">' + esc((e && (e.stack || e.message)) || e) + '</div>';
    boot.hidden = false;
  }

  window.addEventListener('error', function (e) { if (!started) fail(e.error || e.message); });
  window.addEventListener('unhandledrejection', function (e) { if (!started) fail(e.reason); });

  boot.hidden = true;
  var coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;

  function goFullscreen() {
    var el = document.documentElement;
    try {
      if (!document.fullscreenElement && el.requestFullscreen) {
        return el.requestFullscreen({ navigationUI: 'hide' }).catch(function () {});
      }
    } catch (e) { /* refused -- still playable windowed */ }
    return Promise.resolve();
  }

  document.getElementById('fsbtn').addEventListener('click', function (e) {
    e.stopPropagation();
    if (document.fullscreenElement) { if (document.exitFullscreen) document.exitFullscreen(); }
    else goFullscreen();
  });
  document.addEventListener('fullscreenchange', function () {
    document.body.classList.toggle('fs', !!document.fullscreenElement);
  });

  function board() {
    if (started) return;
    started = true;
    if (coarse) goFullscreen();
    gate.remove();
    boot.hidden = false;
    try { window.__arkBoot(); } catch (e) { started = false; fail(e); }
  }
  gate.addEventListener('click', board);
  gate.addEventListener('touchend', function (e) { e.preventDefault(); board(); }, { passive: false });

  window.__arkBoot = function () {
/*__BUNDLE__*/
  };
}());
</script>
